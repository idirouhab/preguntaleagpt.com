<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    @media (prefers-color-scheme: dark) { image { filter: url(#dark-ink); } }
  </style>
  <defs>
    <filter id="dark-ink" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0.72 0 -0.72 0 0.96
        0.39 0 -0.39 0 0.96
        -0.025 0 0.025 0 0.96
        0 0 0 1 0"/>
    </filter>
  </defs>
  <image width="256" height="256" href="data:image/png;base64,"/>
</svg>
